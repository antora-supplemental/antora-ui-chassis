# Color-scheme picker demo: Valentus Layout + chassis default-paint +
# brand-placeholder + the scheme-demo-paint test fixture (six schemes, so the
# picker page and its footer link appear), footer Light / Dark / Auto switch.
site:
  title: Color scheme picker demo
  start_page: chassis-demo::index.adoc

content:
  sources:
    - url: ../..
      branches: HEAD
      start_path: demos/valentus-layout/content
    - url: https://github.com/antora-supplemental/demo-data.git
      tags: [v0.3.5]
      branches: []
      start_path: docs/demo-pages

ui:
  # Valentus Layout (layout only, no Valentus Paint), pinned to valentus-theme v4.2.0.
  bundle:
    url: https://github.com/antora-supplemental/valentus-theme/releases/download/v4.2.0/valentus-layout-bundle.zip
    snapshot: false

output:
  dir: ./build/picker

runtime:
  fetch: true

antora:
  extensions:
    - require: ../../packages/brand-placeholder/lib/index.js
    - require: ../../packages/light-dark-mode/lib/index.js
      toggle_placement: footer
      color_scheme:
        picker: auto
    - require: ../../packages/default-paint/lib/index.js
    - require: ../../packages/color-scheme/test/fixtures/scheme-demo-paint/index.js

asciidoc:
  attributes:
    source-highlighter: highlight.js
    page-demo-variant: picker
