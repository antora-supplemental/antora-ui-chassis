# Minimal UiBus + SoftNav + page-state on Antora Default UI (no Valentus).
site:
  title: Minimal SoftNav example
  url: https://example.local
  start_page: demo::index.adoc

content:
  sources:
    - url: .
      branches: HEAD
      start_path: docs

ui:
  bundle:
    url: https://gitlab.com/antora/antora-ui-default/-/jobs/artifacts/HEAD/raw/build/ui-bundle.zip?job=bundle-stable
    snapshot: true

antora:
  extensions:
    - require: '@antora-supplemental/chassis-compose'

output:
  dir: ./build/site
