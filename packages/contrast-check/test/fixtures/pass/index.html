<!doctype html><html lang="en"><head><meta charset="utf-8"><title>pass</title>
<style>
:root{--cs-canvas:#ffffff;--cs-ink:#1a1a1a;--cs-ink-muted:#4a4a4a;--cs-accent:#0b5cad;--cs-accent-soft:rgba(11,92,173,.12)}
@media (prefers-color-scheme:dark){:root{--cs-canvas:#121212;--cs-ink:#f0f0f0;--cs-ink-muted:#c8c8c8;--cs-accent:#8cc4ff;--cs-accent-soft:rgba(140,196,255,.14)}}
body{background:var(--cs-canvas);color:var(--cs-ink);font:16px/1.5 sans-serif}
p.muted{color:var(--cs-ink-muted)} a{color:var(--cs-accent);text-decoration:underline}
a:hover{text-decoration:none} a:focus-visible,button:focus-visible{outline:2px solid var(--cs-accent);outline-offset:2px}
button{background:var(--cs-canvas);color:var(--cs-ink);border:2px solid var(--cs-ink)} button:hover{background:var(--cs-ink);color:var(--cs-canvas)}
</style></head><body><main><h1>Pass</h1><p>Body text with an <a href="#x">underlined link</a>.</p><p class="muted">Muted text.</p><button>Button</button></main></body></html>
